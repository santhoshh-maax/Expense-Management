<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Smart Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase App & Auth SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="user-plus"></i>
        </div>
        <h1>Create Account</h1>
        <p>Start tracking your expenses and managing your budget</p>
      </div>

      <div id="auth-alert" class="auth-alert" style="display: none;"></div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat your password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary auth-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.Utils.renderIcons();
      await window.Auth.redirectIfAuthenticated();

      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('reg-submit-btn');

      const showAlert = (msg) => {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      };

      const hideAlert = () => {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        if (!name || !email || !password || !confirmPassword) {
          showAlert('Please fill in all required fields.');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          showAlert('Passwords do not match. Please verify.');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';

          await window.Auth.register(name, email, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error(err);
          let message = 'Registration failed. Please try again.';
          if (err.code === 'auth/email-already-in-use') {
            message = 'This email is already registered. Please sign in.';
          } else if (err.code === 'auth/weak-password') {
            message = 'Password is too weak. Please use a stronger password.';
          } else if (err.message) {
            message = err.message;
          }
          showAlert(message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
