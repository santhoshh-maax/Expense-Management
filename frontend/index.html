<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
          <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
        </svg>
      </div>
      <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Smart Expense Management</h1>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Connecting to your financial dashboard...</p>
      <div style="display: flex; justify-content: center; gap: 12px;">
        <a href="login.html" class="btn btn-primary" style="padding: 10px 24px;">Sign In</a>
        <a href="register.html" class="btn btn-secondary" style="padding: 10px 24px;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.Auth.init();
      const token = await window.Auth.getIdToken();
      if (token) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
