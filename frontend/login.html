<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Smart Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase App & Auth SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="wallet"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to access your financial dashboard</p>
      </div>

      <div id="auth-alert" class="auth-alert" style="display: none;"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="login-password">Password</label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary auth-btn">
          Sign In
        </button>

        <button type="button" id="demo-login-btn" class="btn btn-secondary auth-btn" style="border-style: dashed;">
          <i data-lucide="zap"></i> Quick Demo Access
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Create an Account</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.Utils.renderIcons();
      await window.Auth.redirectIfAuthenticated();

      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('login-btn');
      const demoBtn = document.getElementById('demo-login-btn');

      const showAlert = (msg) => {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      };

      const hideAlert = () => {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          await window.Auth.login(email, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error(err);
          let message = 'Failed to sign in. Please check your credentials.';
          if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            message = 'Invalid email or password.';
          } else if (err.message) {
            message = err.message;
          }
          showAlert(message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });

      // Quick Demo login
      if (demoBtn) {
        demoBtn.addEventListener('click', async () => {
          try {
            demoBtn.disabled = true;
            demoBtn.textContent = 'Entering Demo Dashboard...';
            await window.Auth.loginDemo();
            window.location.href = 'dashboard.html';
          } catch (err) {
            console.error(err);
            showAlert('Demo login failed: ' + err.message);
            demoBtn.disabled = false;
            demoBtn.innerHTML = '<i data-lucide="zap"></i> Quick Demo Access';
            window.Utils.renderIcons();
          }
        });
      }
    });
  </script>
</body>
</html>
